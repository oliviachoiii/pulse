name: Container CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -v

      - name: Build container image
        run: docker build -t pulse:ci .

      - name: Scan image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --severity CRITICAL \
            pulse:ci

      - name: Start container
        run: |
          docker run \
            -d \
            --name pulse \
            -p 8000:8000 \
            pulse:ci

      - name: Wait for service
        run: sleep 5

      - name: Smoke test container
        run: curl --fail http://localhost:8000/health

      - name: Verify container runs as non-root
        run: |
          test "$(docker exec pulse whoami)" = "appuser"

      - name: Show container logs on failure
        if: failure()
        run: docker logs pulse || true

      - name: Stop container
        if: always()
        run: docker rm -f pulse || true
